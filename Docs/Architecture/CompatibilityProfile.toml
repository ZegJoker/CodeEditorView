# Zed-style compatibility profile for CodeEditorView extensions.
# Status values: stable | compatibility | experimental | deprecated | unsupported | registry-replacement

profile = "zed-style-2026-07"
upstream_commit = "phase-15"
manifest_schema = 1
swift_extension_api = "1.0"
status = "phase-15"

[features]
languages = "stable"
themes = "stable"
icon_themes = "stable"
snippets = "stable"
language_servers = "stable"
completion_labels = "stable"
symbol_labels = "stable"
debug_adapters = "stable"
debug_locators = "stable"
mcp_servers = "stable"
process_exec = "stable"
download_file = "stable"
npm_install = "stable"
worktree = "stable"
project = "stable"
settings = "stable"
kv_store = "stable"
documentation_indexing = "stable"
slash_commands = "compatibility"
language_model_provider_metadata = "experimental"
legacy_agent_server_hosting = "unsupported"

[runtimes]
builtin_swift = "stable"
data_only = "stable"
native_process = "stable"
swift_wasm = "experimental"
remote_provider = "experimental"

[compatibility_levels]
S0_package = "passing"
S1_data = "passing"
S2_swift_api_parity = "in-progress"
S3_behavioral = "in-progress"
S4_operational = "in-progress"
ZB_zed_binary_bridge = "not-claimed"
