# CodeEditor Swift-first extension compatibility profile.
# Status values: stable | compatibility | experimental | deprecated | unsupported | registry-replacement

profile = "codeeditor-swift-first-2026"
upstream_commit = "phase-16"
manifest_schema = 1
swift_extension_api = "1.0"
status = "phase-16-rc"

[features]
languages = "stable"
themes = "stable"
icon_themes = "stable"
snippets = "stable"
language_servers = "stable"
completion_labels = "stable"
symbol_labels = "stable"
debug_adapters = "stable"
debug_locators = "stable"
mcp_servers = "stable"
process_exec = "compatibility"
download_file = "compatibility"
npm_install = "experimental"  # host-owned materializer (local registry); not full npm lifecycle
worktree = "compatibility"
project = "compatibility"
settings = "compatibility"
kv_store = "compatibility"
documentation_indexing = "stable"
slash_commands = "stable"
language_model_provider_metadata = "unsupported"
legacy_agent_server_hosting = "unsupported"

[runtimes]
builtin_swift = "stable"
data_only = "stable"
native_process = "compatibility"
swift_wasm = "experimental"  # WasmKit executes modules; product still pre-alpha
remote_provider = "experimental"

[compatibility_levels]
S0_package = "passing"
S1_data = "passing"
S2_swift_api_parity = "passing"
S3_behavioral = "passing"
S4_operational = "passing"
