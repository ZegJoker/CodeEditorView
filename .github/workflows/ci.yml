name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  checks:
    name: Scripts (isolation, docs, pins, licenses, format)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select / verify Xcode pin (CI-009)
        run: ./scripts/check-xcode-pin.sh
      - name: Isolation
        run: ./scripts/check-product-isolation.sh
      - name: Docs inventory
        run: ./scripts/check-docs.sh
      - name: Feature profiles (Phase 15)
        run: ./scripts/check-feature-profiles.sh
      - name: Product scorecards (Phase 16)
        run: ./scripts/check-product-scorecards.sh
      - name: Defects no open P0/P1 (Phase 16)
        run: ./scripts/check-defects.sh
      - name: API freeze Stable products (Phase 16)
        run: ./scripts/check-api-freeze.sh
      - name: Accessibility surface (Phase 16)
        run: ./scripts/check-accessibility.sh
      - name: Grammar pins + committed sources (PKG-001)
        run: ./scripts/verify-grammars.sh
      - name: Licenses
        run: ./scripts/check-licenses.sh
      - name: Install swift-format
        run: |
          if ! command -v swift-format >/dev/null 2>&1; then
            brew install swift-format
          fi
          swift-format --version
      - name: Format (hard)
        run: ./scripts/check-format.sh
      - name: Ghostty pin present
        run: test -f Docs/Architecture/GHOSTTY.pin && grep -E '^GHOSTTY_COMMIT=' Docs/Architecture/GHOSTTY.pin

  macos-debug:
    name: macOS debug test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: swift test (debug)
        run: swift test
      - name: Release evidence (CI-001)
        run: ./scripts/generate-release-evidence.sh Baselines/evidence
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: Baselines/evidence/
          if-no-files-found: warn

  ghostty-pin:
    name: Ghostty pin metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify GHOSTTY.pin
        run: |
          set -euo pipefail
          test -f Docs/Architecture/GHOSTTY.pin
          grep -E '^GHOSTTY_COMMIT=[0-9a-f]{40}$' Docs/Architecture/GHOSTTY.pin
          grep -E '^GHOSTTY_REPO=https://' Docs/Architecture/GHOSTTY.pin
          echo "Ghostty pin OK:"
          cat Docs/Architecture/GHOSTTY.pin
      - name: Optional libghostty-vt build
        # Best-effort: Ghostty dep CDN can fail; pin verification is required, library build is optional.
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x scripts/build-ghostty.sh scripts/link-ghostty-flags.sh
          ./scripts/build-ghostty.sh vt
          eval "$(./scripts/link-ghostty-flags.sh)"
          if [[ "${CODEEDITOR_GHOSTTY_LINKED:-}" == "1" ]]; then
            CODEEDITOR_GHOSTTY_LINKED=1 swift build --product CodeEditorTerminalGhostty
          fi

  macos-release:
    name: macOS release test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: swift test (release)
        run: swift test -c release

  strict-concurrency:
    name: Strict concurrency build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: Build with complete concurrency checking
        # Package already uses Swift 6 language mode; reinforce via frontend flags.
        # (warnings-as-errors deferred until Phase 2+ clears residual concurrency warnings)
        run: swift build -Xswiftc -strict-concurrency=complete

  ios-simulator:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: Resolve package
        run: swift package resolve
      - name: Build for iOS Simulator (SPM triple)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          # arm64 iOS Simulator is standard on Apple Silicon runners.
          swift build \
            --triple arm64-apple-ios18.0-simulator \
            -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xcc -isysroot -Xcc "$SDK"

  resolve-empty-cache:
    name: Empty-cache resolve + build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: Clear SwiftPM / build caches
        run: |
          rm -rf .build
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .swiftpm/configuration
      - name: Resolve from empty cache
        run: swift package resolve
      - name: Build
        run: swift build

  product-smoke:
    name: Independent product smoke builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: Smoke products
        run: ./scripts/smoke-products.sh

  lsp-matrix:
    name: LanguageServices + LSP matrix
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: LanguageServices tests
        run: swift test --filter CodeEditorLanguageServices
      - name: LSP mock matrix tests
        run: swift test --filter CodeEditorLSP
      - name: Real language server probe
        run: |
          set -euo pipefail
          if command -v sourcekit-lsp >/dev/null 2>&1; then
            echo "sourcekit-lsp present: $(command -v sourcekit-lsp)"
            sourcekit-lsp --help >/dev/null 2>&1 || true
            echo "REAL_SERVER=sourcekit-lsp" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sourcekit-lsp not on PATH — mock matrix remains the required gate"
            echo "REAL_SERVER=skipped (sourcekit-lsp missing)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if command -v clangd >/dev/null 2>&1; then
            echo "clangd present: $(command -v clangd)"
            echo "SECOND_SERVER=clangd" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SECOND_SERVER=skipped (clangd missing)" >> "$GITHUB_STEP_SUMMARY"
          fi

  tooling-matrix:
    name: Tasks Terminal SourceControl matrix
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: Tasks / Terminal / SourceControl tests
        run: swift test --filter 'CodeEditorTasks|CodeEditorTerminal|CodeEditorSourceControl'
      - name: Tooling availability
        run: |
          set -euo pipefail
          echo "git=$(command -v git || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "shell=$(command -v sh || true)" >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Test with coverage
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: swift test --enable-code-coverage
        run: swift test --enable-code-coverage
      - name: Export coverage artifact
        if: always()
        run: |
          mkdir -p coverage-out
          BIN=$(swift build --show-bin-path)
          if command -v xcrun >/dev/null; then
            xcrun llvm-cov export -format=lcov \
              "${BIN}/CodeEditorViewPackageTests.xctest/Contents/MacOS/CodeEditorViewPackageTests" \
              -instr-profile default.profdata \
              > coverage-out/coverage.lcov 2>/dev/null || true
          fi
          find . -name '*.profdata' -o -name 'coverage.lcov' | head
          cp -R .build coverage-out/build-meta 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage-out
          if-no-files-found: warn

  api-diff:
    name: API symbol-graph baseline
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed grammars (PKG-001)
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: Emit API baselines
        run: ./scripts/check-api-baseline.sh
      - uses: actions/upload-artifact@v4
        with:
          name: api-baselines
          path: Baselines/api

  wasi-sdk:
    name: Swift WASI SDK pin (hard)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Install/verify pinned WASI SDK
        run: ./scripts/check-wasi-sdk.sh

  source-archive-rehearsal:
    name: Source archive rehearsal (PKG-001)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode pin
        run: ./scripts/check-xcode-pin.sh
      - name: Export archive + resolve/build
        run: ./scripts/export-source-archive-rehearsal.sh Baselines/evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-archive-evidence-${{ github.sha }}
          path: Baselines/evidence/source-archive.sha256
          if-no-files-found: error

  macos-example-app:
    name: macOS example app (xcodebuild test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode pin
        run: ./scripts/check-xcode-pin.sh
      - name: Verify grammars
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: swift test (example package)
        run: |
          cd Examples/macOS/CodeEditorMacExample
          swift test
      - name: xcodebuild test
        run: |
          set -euo pipefail
          cd Examples/macOS/CodeEditorMacExample
          DD=$(mktemp -d)
          xcodebuild \
            -scheme CodeEditorMacExample \
            -destination 'platform=macOS' \
            -derivedDataPath "$DD" \
            test
          rm -rf "$DD"

  ios-example-app:
    name: iOS example app (xcodebuild test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode pin
        run: ./scripts/check-xcode-pin.sh
      - name: Verify grammars
        run: ./scripts/ci-bootstrap-grammars.sh
      - name: xcodebuild test (iOS Simulator)
        run: |
          set -euo pipefail
          cd Examples/iOS/CodeEditoriOSExample
          DD=$(mktemp -d)
          DEST="platform=iOS Simulator,name=iPhone 16"
          if ! xcrun simctl list devices available 2>/dev/null | grep -q "iPhone 16"; then
            # Pick first available iPhone simulator
            NAME=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{gsub(/^ +| +$/,"",$1); print $1; exit}')
            if [[ -n "$NAME" ]]; then
              DEST="platform=iOS Simulator,name=$NAME"
            else
              DEST="generic/platform=iOS Simulator"
            fi
          fi
          echo "Using destination: $DEST"
          # SPM resource bundles + package tests: disable codesign on simulator.
          xcodebuild \
            -scheme CodeEditoriOSExample \
            -destination "$DEST" \
            -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
          rm -rf "$DD"
